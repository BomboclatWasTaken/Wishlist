
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine ønskelister | Ønskeseddel</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <h1>Mine ønskelister</h1>

    <p>Her kan du se og administrere dine ønskelister.</p>

    <p th:if="${errorMessage}"
       th:text="${errorMessage}"
       style="color: red;">
    </p>

    <a th:href="@{/wishlists/create}">
        Opret ny ønskeliste
    </a>

    <section>

        <h2>Dine ønskelister</h2>

        <p th:if="${#lists.isEmpty(wishlists)}">
            Du har endnu ikke oprettet nogen ønskelister.
        </p>

        <div th:each="wishlist : ${wishlists}">

            <article>

                <h3 th:text="${wishlist.title}"></h3>

                <a th:href="@{/wishlists/{id}(id=${wishlist.id})}">
                    Se ønskeliste
                </a>

            </article>

        </div>

    </section>

</main>

</body>
</html>
