<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf-org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opret konto | Ønskeseddel</title>
</head>

<body>

<main>

    <h1>Opret konto</h1>

    <p>Opret en konto for at komme i gang med ønskelister.</p>

    <p th:if="${errorMessage}"
       th:text="${errorMessage}"
       style="color: red;">
    </p>

    <form th:action="@{/register}" method="post">

        <div>

            <label for="name">Navn</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Indtast dit navn"
                required
                maxlength="100">

        </div>

        <div>

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Indtast din e-mail"
                required>

        </div>

        <div>

            <label for="password">Adgangskode</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Vælg en adgangskode"
                required>

        </div>

        <div>

            <label for="confirmPassword">Gentag adgangskode</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Gentag din adgangskode"
                required>

        </div>

        <button type="submit">Opret konto</button>

    </form>

    <p>
        Har du allerede en konto?
        <a th:href="@{/login}">Log ind</a>
    </p>

    <a th:href="@{/}">Tilbage til forsiden</a>

</main>

</body>
</html>
