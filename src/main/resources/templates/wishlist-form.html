
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret ønskeliste | Ønskeseddel</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <section>
        <div>
            <h1>Opret en ny ønskeliste</h1>
            <p>
                Start med at give din ønskeliste en titel.
                Du kan efterfølgende tilføje alle dine ønsker.
            </p>
        </div>
    </section>

    <section>
        <div>
            <h2>Navngiv din ønskeliste</h2>

            <form th:action="@{/wishlists/create}" method="post">

                <div>
                    <label for="title">Titel på ønskeliste</label>
                    <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="F.eks. Fødselsdag eller jul"
                            required
                            maxlength="100">
                </div>

                <div>
                    <button type="submit">Opret ønskeliste</button>
                    <a th:href="@{/wishlists}">Annuller</a>
                </div>

            </form>
        </div>
    </section>

    <section>
        <h2>Hvad sker der bagefter?</h2>
        <p>
            Når din ønskeliste er oprettet, kan du tilføje ønsker,
            redigere listen og dele den med familie og venner.
        </p>
    </section>

</main>

</body>
</html>
