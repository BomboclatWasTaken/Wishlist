<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delt ønskeliste | Ønskeseddel</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main>

    <section th:if="${wishlist == null}">
        <div>
            <h1>Ønskelisten findes ikke</h1>
            <p th:text="${errorMessage}"></p>
            <a th:href="@{/}">Tilbage til forsiden</a>
        </div>
    </section>

    <div th:if="${wishlist != null}">

        <section>
            <div>
                <p>Delt ønskeliste</p>
                <h1 th:text="${wishlist.title}"></h1>
                <p>
                    Her kan du se alle ønskerne på denne ønskeliste.
                </p>
            </div>
        </section>

        <section>
            <div>
                <h2>Ønsker på listen</h2>

                <p th:if="${#lists.isEmpty(wishes)}">
                    Denne ønskeliste indeholder endnu ingen ønsker.
                </p>

                <div th:unless="${#lists.isEmpty(wishes)}">

                    <div th:each="wish : ${wishes}">
                        <article>
                            <div>
                                <h3 th:text="${wish.name}"></h3>

                                <p th:if="${wish.description != null and !wish.description.isEmpty()}"
                                   th:text="${wish.description}">
                                </p>
                            </div>

                            <div>
                                <p th:if="${wish.price > 0}"
                                   th:text="${wish.price} + ' kr.'">
                                </p>

                                <a th:if="${wish.linkUrl != null and !wish.linkUrl.isEmpty()}"
                                   th:href="${wish.linkUrl}"
                                   target="_blank"
                                   rel="noopener noreferrer">
                                    Se produkt
                                </a>
                            </div>
                        </article>
                    </div>

                </div>
            </div>
        </section>

    </div>

</main>

</body>
</html>
