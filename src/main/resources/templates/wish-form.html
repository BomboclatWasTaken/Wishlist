<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret ønske | Ønskeseddel</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <section>
        <div>
            <h1>Tilføj et nyt ønske</h1>
            <p>
                Udfyld oplysningerne nedenfor for at tilføje
                et nyt ønske til din ønskeliste.
            </p>
        </div>
    </section>

    <section>
        <div>
            <h2>Oplysninger om dit ønske</h2>

            <p th:if="${errorMessage}" th:text="${errorMessage}"></p>

            <form th:action="@{/wishlists/{id}/wishes(id=${listId})}" method="post">

                <div>
                    <label for="name">Titel</label>
                    <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Indtast ønskets titel"
                            required
                            maxlength="100">
                </div>

                <div>
                    <label for="description">Beskrivelse</label>
                    <textarea
                            id="description"
                            name="description"
                            placeholder="Beskriv dit ønske">
                    </textarea>
                </div>

                <div>
                    <label for="price">Pris (kr.)</label>
                    <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Indtast pris"
                            min="0"
                            step="0.01">
                </div>

                <div>
                    <label for="linkUrl">Produktlink</label>
                    <input
                            type="url"
                            id="linkUrl"
                            name="linkUrl"
                            placeholder="https://">
                </div>

                <div>
                    <button type="submit">Gem ønske</button>
                    <a th:href="@{/wishlists/{id}(id=${listId})}">Annuller</a>
                </div>

            </form>
        </div>
    </section>

</main>

</body>
</html>
