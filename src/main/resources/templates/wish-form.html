<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret ønske | Ønskeseddel</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>

    <h1>Tilføj ønske</h1>

    <p>Udfyld oplysningerne om det ønske, du vil tilføje.</p>

    <p th:if="${errorMessage}"
       th:text="${errorMessage}"
       style="color: red;">
    </p>

    <form th:action="@{/wishlists/{id}/wishes(id=${listId})}" method="post">

        <div>

            <label for="name">Titel</label>

            <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Indtast ønskets titel"
                    required
                    maxlength="100">

        </div>

        <div>

            <label for="description">Beskrivelse</label>

            <textarea
                    id="description"
                    name="description"
                    placeholder="Beskriv dit ønske">
            </textarea>

        </div>

        <div>

            <label for="price">Pris (kr.)</label>

            <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="Indtast pris"
                    min="0"
                    step="0.01">

        </div>

        <div>

            <label for="linkUrl">Produktlink</label>

            <input
                    type="url"
                    id="linkUrl"
                    name="linkUrl"
                    placeholder="https://">

        </div>

        <button type="submit">Gem ønske</button>

        <a th:href="@{/wishlists/{id}(id=${listId})}">
            Annuller
        </a>

    </form>

</main>

</body>
</html>
