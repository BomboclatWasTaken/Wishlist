<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log ind | Ønskeseddel</title>
</head>

<body>

<main>

    <h1>Log ind</h1>

    <p>Log ind for at se og administrere dine ønskelister</p>

    <p th:if="${errorMessage}"
       th:text="${errorMessage}"
       style="color: red;">
    </p>

    <form th:action="@{/login}" method="post">

        <div>

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Indtast den e-mail"
                required>

        </div>

        <div>

            <label for="password">Adgangskode</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Indtast din adgangskode"
                required>

        </div>

        <button type="submit">Log ind</button>

    </form>

    <p>
        Har du ikke en konto?
        <a th:href="@{/register}">Opret en konto</a>
    </p>

    <a th:href="@{/}">Tilbage til forsiden</a>

</main>

</body>
</html>
